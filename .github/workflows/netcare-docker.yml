# NetCare 테스트 → 도커 이미지 빌드(amd64·arm64) → GitHub Container Registry 배포
name: NetCare Docker image

on:
  push:
    branches: [main]
    paths: ["NetCare/**", ".github/workflows/netcare-docker.yml"]
    tags: ["netcare-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/netcare

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetCare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NetCare/requirements.txt
      - run: pip install -r requirements.txt pytest-github-actions-annotate-failures
      - run: python -m pytest -q -rfE

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=netcare-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: NetCare
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
